<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLDOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- //header -->
    <div id="header">
        <div class="left" style="display: flex;">
            <p class="barText" style="margin-left: 16px; font-style:normal; font-weight: bold;">
                OLD OS
            </p>

            <p class="barText btn" id="deskBtn">
                Desktop
            </p>
        </div>
        <div class="center" style="display: flex;">
            <p class="barText" id="emojiSpan" style="margin-right: 2px;">

            </p>
            <p class="barText" id="quoteSpan" style=" margin-left: 2px;">

            </p>
        </div>

        <p class="barText" id="timeSpan">
            22-08-2026 14:22
        </p>

    </div>

    <!-- //window -->
    <div id="firstWindow" class="slide">
        <div id="firstWindowHeader">
            <p class="windowName"></p>
            <p class="windowName">
                Welcome!
            </p>
            <img class="btn" id="closeBtn" src="osAssets/close.png" alt="" srcset="">
        </div>
        <h1 id="firstWindowHeading">oldOs</h1>
        <img id="imgKeeper" src="osAssets/OldOsKeeper.png" alt="" srcset="">
        <h2>The os where everything is historic!</h2>
        <marquee behavior="alternate" direction="">Enjoy your stay at the oldOs: Vintage, ageless and Beautiful!
        </marquee>
    </div>

    <script src="script.js"></script>
</body>

</html>
